<!DOCTYPE html>
<html lang="en">

<head>
    <title>CRICKET GAME</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>BAT BALL STUMP GAME</h1>
    <div class="container">
    <button onclick="
    let computerChoice = generateComputerChoice();
    let resultMsg = getResult('bat', computerChoice);
    showResult('bat', computerChoice, resultMsg);
    " class="btn">🏏 BAT</button>


    <button onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('ball', computerChoice);
    showResult('ball', computerChoice, resultMsg);
    " class="btn">🏐 BALL</button>


    <button onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('stump', computerChoice);
    showResult('stump', computerChoice, resultMsg);
    " class="btn">🏟️ STUMP</button>

    <button onclick="localStorage.clear()
    resetScore();
    " class="btn">🔄 RESET</button>
    </div>

    <div class="container2">
    <h3>Game Status</h3>
    <div id="user-move"></div>
    <div id="computer-move"></div>
    <div id="container3">
    <div id="result"></div>
    <div id="score"></div>
    </div>        
</div>

        <footer><h2 id="foot">Copyright © 2026 Safik Sherasiya. All Rights Reserved.</h1></footer>
    <script>

        let scorestr = localStorage.getItem('score');
        let score;
        resetScore(scorestr);

        function resetScore(scorestr) {
            score = scorestr ? JSON.parse(scorestr) : {
                win: 0,
                lost: 0,
                tie: 0,
            };

            score.displayScore = function () {
                return `Win: ${score.win}  Lost: ${score.lost}  Tie: ${score.tie}`;
            };

            showResult();
        }

        function generateComputerChoice() {
            computerChoice = Math.random() * 3;
            if (computerChoice > 0 && computerChoice < 1) {
                return 'bat';
            } else if (computerChoice > 1 && computerChoice < 2) {
                return 'ball';
            } else if (computerChoice > 2 && computerChoice < 3) {
                return 'stump';
            }
        }

        function getResult(userMove, computerMove) {
            if (userMove === 'bat') {
                if (computerMove === 'ball') {
                    score.win++;
                    return 'You have won';
                } else if (computerMove === 'bat') {
                    score.tie++;
                    return 'You have tied';
                } else if (computerMove === 'stump') {
                    score.lost++;
                    return 'You have lost';
                }
            } else if (userMove === 'ball') {
                if (computerMove === 'bat') {
                    score.lost++;
                    return 'You have lost';
                } else if (computerMove === 'ball') {
                    score.tie++;
                    return 'You have tied';
                } else if (computerMove === 'stump') {
                    score.win++;
                    return 'You have won';
                }
            } else if (userMove === 'stump') {
                if (computerMove === 'bat') {
                    score.win++;
                    return 'You have won';
                } else if (computerMove === 'ball') {
                    score.lost++;
                    return 'You have lost';
                } else if (computerMove === 'stump') {
                    score.tie++;
                    return 'You have tied';
                }
            }
        }

        function showResult(userMove, computerMove, resultMsg) {
            localStorage.setItem('score', JSON.stringify(score));
            document.querySelector('#user-move').innerText = userMove ? `👤 You have chosen: ${userMove}` : '';
            document.querySelector('#computer-move').innerText = computerMove ? `🤖 Computer has chosen: ${computerMove}` : '';
            document.querySelector('#result').innerText = resultMsg ? `${resultMsg}` : '';
            document.querySelector('#score').innerText = score.displayScore();
        }


    </script>
</body>

</html>
