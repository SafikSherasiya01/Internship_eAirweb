<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM</title>
</head>
<body>
    <div class="my-div">this is my div</div>
    <script>
    let button = document.createElement('Button');
    button.innerText = 'ClickMe'
    document.querySelector('.my-div').appendChild(button);
    document.querySelector('.my-div').removeChild(button);

    </script>
</body>
</html>
