<!DOCTYPE html>
<html lang="en">

<head>
    <title>Local Storage</title>
</head>

<body>
    <script>
        localStorage.setItem('name', 'safik');

        let product = {
            name: "Laptop",
            brand: "HP",
            price: 50000,
        }

        let str = JSON.stringify(product);
        console.log(str);
        let str2 = JSON.parse(str);
        console.log(str2);
        
        localStorage.setItem('product',JSON.stringify(product));
        console.log(product);
</script>
</body>
</html>
