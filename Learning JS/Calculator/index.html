<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <style>
        .container{
            border: 1px solid black;
            height: 450px;
            width: 200px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
        }
        .box{
            border: 1px solid black;
            height: 50px;
            width: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px;
            
        }
        #buttons{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        #display{
            height: 50px;
            width: 300px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
            <input type="text" id="display" >
        <div id="buttons">
        <div class="box" onclick=" currentDisplay = '';
         document.querySelector('#display').value = currentDisplay;">C</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '1';
         document.querySelector('#display').value = currentDisplay;">1</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '2';
         document.querySelector('#display').value = currentDisplay;">2</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '3';
         document.querySelector('#display').value = currentDisplay;">3</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '4';
         document.querySelector('#display').value = currentDisplay;">4</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '5';
         document.querySelector('#display').value = currentDisplay;">5</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '6';
         document.querySelector('#display').value = currentDisplay;">6</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '7';
         document.querySelector('#display').value = currentDisplay;">7</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '8';
         document.querySelector('#display').value = currentDisplay;">8</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '9';
         document.querySelector('#display').value = currentDisplay;">9</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '0';
         document.querySelector('#display').value = currentDisplay;">0</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '+';
         document.querySelector('#display').value = currentDisplay;">+</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '-';
         document.querySelector('#display').value = currentDisplay;">-</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '*';
         document.querySelector('#display').value = currentDisplay;">*</div>
        <div class="box" onclick=" currentDisplay = currentDisplay + '/';
         document.querySelector('#display').value = currentDisplay;">/</div>
        <div class="box" onclick=" 
        let result = eval(currentDisplay);
        currentDisplay = result;
        document.querySelector('#display').value = currentDisplay;">=</div>
        </div>
    </div>
    <script>
        let currentDisplay = '';
        document.querySelector('#display').value = currentDisplay;
    </script>
</body>
</html>
