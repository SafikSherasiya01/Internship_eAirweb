<!DOCTYPE html>
<html lang="en">
<head>
    <title>Metro Bus ticket discount</title>
</head>
<body>
    <script>
        let age = 4 ;
        let gender = "female";
        let discount;
        if(age < 5 ){
            discount = 100;
        }else if (gender==="female" || age <= 8){
            discount = 50;
        }
        else if (age > 65){
            discount = 30;
        }
        else{
            discount = 0;
        }

        console.log(`discount is ${discount}%`)
    </script>
</body>
</html>
