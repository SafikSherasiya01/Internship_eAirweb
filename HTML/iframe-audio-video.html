<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Learning About Iframe, Audio and Video Tags in HTML</h1>

    <hr>
    <h4>IFRAME TAG </h4>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/9qhF1he3xyo?si=SVS3MXYL_wz1VYZF" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <hr>
    <h4>AUDIO TAG</h4>
    <audio controls>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <br><br>

    <hr>
    <h4>VIDEO TAG</h4>
    <video width="400" height="300" controls>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

</body>
</html>
