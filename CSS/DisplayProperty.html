<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Display Property</title>
    <style>
        h1{
            color:darkgoldenrod;
            text-align: center;
        }
        .box{
            background-color:cadetblue;
            height: 200px;
            width: 200px;
            margin: 5px;
        }
        #b1{
            display: block;
        }
        #b2{
            display: inline;
        }
        #id3{
            display: inline-block;
        }
        #id4{
            display:inline-block
        }
        #id5{
            display: none;
        }

    </style>
</head>
<body>
    <hr>
    <h1>CSS Display Property</h1>
    <hr>
    <h1>Display Block</h1>
    <div id="b1" class="box">Lorem, ipsum.</div>
    <div id="b1" class="box">Lorem, ipsum.</div>
    <div id="b1" class="box">Lorem, ipsum.</div>
    <hr>
    <h1>Display Inline</h1>
    <div id="b2" class="box">Lorem ipsum .</div>
    <div id="b2" class="box">Lorem ipsum .</div>
    <div id="b2" class="box">Lorem ipsum .</div>
    <hr>
    <h1>Display Inline-block</h1>
    <div class="box" id="id3">Lorem, ipsum dolor.</div>
    <div class="box" id="id3">Lorem, ipsum dolor.</div>
    <div class="box" id="id3">Lorem, ipsum dolor.</div>
    <hr>
    <h1>Display None</h1>
    <div class="box" id="id5">Lorem, ipsum dolor.</div>
    <div class="box" id="id4">Lorem, ipsum dolor.</div>
    <div class="box" id="id4">Lorem, ipsum dolor.</div>
</body>
</html>
