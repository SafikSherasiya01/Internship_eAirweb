<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Property</title>
    <style>
        h1,h2{
            color:darkgoldenrod;
            text-align: center;
        }
        #con{
            height: 200px;
            width: 200px;
            border: 2px solid black;
            background-color: aquamarine;
        }
        #b1{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: burlywood;
            float: right;
            margin: 5px;
        }
        #b2{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: burlywood;
            float: left;
            margin: 5px;
        }
        #b3{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: burlywood;
            float: none;
            margin: 5px;
        }

    </style>
</head>
<body>
    <hr>
    <h1>CSS Float Property</h1>
    <hr>
    <h2>Float Left</h2>
    <div id="con">
        <div id="b1"></div>
    </div>
   
    <hr>
    <h2>Float Right</h2>
    <div id="con">
        <div id="b2"></div>
    </div>

    <hr>
    <h2>Float None</h2>
    <div id="con">
        <div id="b3"></div>
    </div>
</body>
</html>
