<!doctype html>
<html lang="en">
  <head>
    <title>Grid Box</title>
    <style>
      .cont {
        height: 500px;
        width: 500px;
        background-color: #ccc;
        display: grid;
      }
      #box1 {
        grid-column: 1/2;
        grid-row: 1/2;
        background-color: red;
      }
      #box2 {
        grid-column: 2/2;
        grid-row: 1/2;
        background-color: blue;
      }
      #box3 {
        grid-column: 1/2;
        grid-row: 2/2;
        background-color: green;
      }
      #box4 {
        grid-column: 2/2;
        grid-row: 2/2;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="cont">
      <div id="box1">BOX 1</div>
      <div id="box2">BOX 2</div>
      <div id="box3">BOX 3</div>
      <div id="box4">BOX 4</div>
    </div>
  </body>
</html>
